<svg xmlns="http://www.w3.org/2000/svg" width="300" height="175" viewBox="0 0 300 175" role="img" aria-label="Most Used Languages">
<title>Most Used Languages</title>
<style>
.t{font:600 18px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#4FA3E0}
.l{font:400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#C9D1D9}
.v{font:700 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#C9D1D9}
.s{font:400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif;fill:#C9D1D9}
.p{fill:#8B9BB4}
.row{opacity:0;animation:in .4s ease-out forwards}
@keyframes in{to{opacity:1}}

</style>
<rect x="0.5" y="0.5" width="299" height="174" rx="6" fill="#0D1B2A" stroke="#1B3A5C"/>
<text class="t" x="25" y="35">Most Used Languages</text>
<clipPath id="bar"><rect x="25" y="50" width="250" height="8" rx="4"/></clipPath>
<g clip-path="url(#bar)"><rect x="25.00" y="50" width="52.07" height="8" fill="#e34c26"/><rect x="77.07" y="50" width="50.74" height="8" fill="#663399"/><rect x="127.81" y="50" width="42.08" height="8" fill="#4F5D95"/><rect x="169.89" y="50" width="37.97" height="8" fill="#3572A5"/><rect x="207.87" y="50" width="34.96" height="8" fill="#f7523f"/><rect x="242.83" y="50" width="32.17" height="8" fill="#f1e05a"/></g>
<g class="row" style="animation-delay:0.00s">
<circle cx="30" cy="84" r="5" fill="#e34c26"/>
<text class="s" x="40" y="88">HTML <tspan class="p">20.83%</tspan></text>
</g>
<g class="row" style="animation-delay:0.10s">
<circle cx="165" cy="84" r="5" fill="#663399"/>
<text class="s" x="175" y="88">CSS <tspan class="p">20.30%</tspan></text>
</g>
<g class="row" style="animation-delay:0.20s">
<circle cx="30" cy="109" r="5" fill="#4F5D95"/>
<text class="s" x="40" y="113">PHP <tspan class="p">16.83%</tspan></text>
</g>
<g class="row" style="animation-delay:0.30s">
<circle cx="165" cy="109" r="5" fill="#3572A5"/>
<text class="s" x="175" y="113">Python <tspan class="p">15.19%</tspan></text>
</g>
<g class="row" style="animation-delay:0.40s">
<circle cx="30" cy="134" r="5" fill="#f7523f"/>
<text class="s" x="40" y="138">Blade <tspan class="p">13.99%</tspan></text>
</g>
<g class="row" style="animation-delay:0.50s">
<circle cx="165" cy="134" r="5" fill="#f1e05a"/>
<text class="s" x="175" y="138">JavaScript <tspan class="p">12.87%</tspan></text>
</g>
</svg>
